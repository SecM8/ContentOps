# =============================================================================
# DEFENDER XDR CUSTOM DETECTION RULE — REFERENCE TEMPLATE
# API: Microsoft Graph Security Beta (/security/rules/detectionRules)
#
# This is a reference document. Copy it, fill in what you need, delete the rest.
# Only include fields that have actual values — the pipeline handles defaults.
#
# Written on the current Graph properties. The deprecated ones (period,
# category, mitreTechniques, impactedAssets, responseActions, scopeType,
# scopeNames) are still read, but a deploy leaves an old key out whenever its
# replacement is filled, and lint PAYLOAD015 warns on them.
# =============================================================================

id: ""                            # Slug ID (required, e.g., defender-encoded-powershell-001)
version: "1.1.0"                  # Semver (required)
platform: defender                # Fixed value
status: experimental              # experimental | test | production | deprecated

defender:
  displayName: ""                 # Required
  description: ""                 # Optional — why this rule exists
  status: enabled                 # enabled | disabled | autoDisabled

  queryCondition:
    queryText: |
      // Advanced Hunting KQL
      // DeviceProcessEvents    DeviceFileEvents      DeviceNetworkEvents
      // DeviceLogonEvents      DeviceRegistryEvents  DeviceImageLoadEvents
      // DeviceEvents           EmailEvents           EmailAttachmentInfo
      // IdentityLogonEvents    CloudAppEvents

  schedule:
    frequency: PT1H               # ISO 8601 days/hours/minutes, 5 minutes to 14 days;
                                  # PT0S = continuous (NRT). Weeks (P1W) are refused by Graph.
    # lookback: PT4H              # Optional; at least the frequency. Under 1 hour: < 48 hours;
                                  # under 1 day: up to 14 days; from 1 day: up to 30 days.
                                  # Not used for a continuous rule.

  detectionAction:
    alertTemplate:
      title: ""                   # Required; unique in the tenant
      description: ""
      severity: medium            # informational | low | medium | high
      recommendedActions: ""

      tactics:                    # MITRE tactics, each with its techniques
        - tactic: Execution       # Execution, Persistence, DefenseEvasion, ...
          techniques:
            - technique: T1059
              subTechniques: [T1059.001]

      entityMappings:             # At least one column required; columns of the query
        hosts:
          - deviceIdColumn: DeviceId
        # accounts:
        #   - nameColumn: AccountName
        #     ntDomainColumn: AccountDomain
        #     sidColumn: AccountSid
        #     aadUserIdColumn: AccountObjectId
        # Other collections: ips, files, processes, cloudApplications, dns,
        # azureResources, amazonResources, googleCloudResources,
        # registryValues, securityGroups, oAuthApplications, urls,
        # mailboxes, mailMessages, mailClusters.

    organizationalScope: null     # null = all devices, or:
    # organizationalScope:
    #   deviceGroups: ["Group Name"]

    automatedActions: {}          # Optional; each action lists the query columns it acts on:
    # automatedActions:
    #   collectInvestigationPackages:
    #     - deviceIdColumn: DeviceId
    # Device: isolateDevices, collectInvestigationPackages, runAntivirusScans,
    #         restrictAppExecutions, initiateInvestigations
    # File:   stopAndQuarantineFiles, blockFiles, allowFiles
    # User:   disableUsers, forceUserPasswordResets, markUsersAsCompromised
    # Email:  hardDeleteEmails, softDeleteEmails, moveEmailsToInbox,
    #         moveEmailsToDeletedItems, moveEmailsToJunk
