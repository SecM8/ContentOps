name: Integration tests

# DANGER: this workflow hits a real Sentinel + Defender tenant. It is
# never auto-triggered. Two ways in:
#   1. Manual: `workflow_dispatch` with `i-know-this-hits-prod=true`
#      to flip the I_UNDERSTAND_THIS_IS_PRODUCTION gate.
#   2. PR: add the `run-integration` label. The conftest still requires
#      RUN_LIVE_TESTS=1 which we set here, *and* the env file-based
#      production-workspace guard — so accidental runs against the
#      production workspace need an explicit `i-know-this-hits-prod`.

on:
  workflow_dispatch:
    inputs:
      i-know-this-hits-prod:
        description: "Set to true to allow the suite to run against the workspace declared in config/tenant.yml."
        required: true
        default: "false"
        type: boolean
      environment:
        description: "GitHub environment (federated-credential subject) to log in with. Pick `production` on a fork that has no `integration` credential."
        required: false
        default: integration
        type: choice
        options: [integration, production]
      sweep-only:
        description: "Only delete leftover zz-itest-/zz_itest_ resources from earlier runs (session sweep); creates nothing."
        required: false
        default: false
        type: boolean
      tests:
        description: "Optional: one live test file to run instead of the whole suite, e.g. tests/integration/test_defender_rule_shape_probe.py. Empty runs the whole suite."
        required: false
        default: ""
        type: string
      ignore-kill-switch:
        description: "Run live tests of a kind CONTENTOPS_DISABLED_KINDS switches off (for example the Defender probe, to find out why it was switched off). Default false: those tests skip."
        required: false
        default: false
        type: boolean
  pull_request:
    types: [labeled]

permissions:
  id-token: write
  contents: read

concurrency:
  # Hits real tenant -- never cancel a run mid-flight. Two parallel
  # dispatches against the same ref serialise rather than stomp.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integration:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'run-integration')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # See deploy.yml for the rationale: matches the federated credential
    # subject on the App Registration. Dispatch may pick `production`
    # instead (forks that only wired a production credential); the
    # label-triggered PR path keeps `integration`.
    environment: ${{ inputs.environment || 'integration' }}
    env:
      RUN_LIVE_TESTS: "1"
      INTEGRATION_SUBSCRIPTION_ID: ${{ secrets.INTEGRATION_SUBSCRIPTION_ID }}
      INTEGRATION_RESOURCE_GROUP: ${{ secrets.INTEGRATION_RESOURCE_GROUP }}
      INTEGRATION_WORKSPACE_NAME: ${{ secrets.INTEGRATION_WORKSPACE_NAME }}
      INTEGRATION_WORKSPACE_LOCATION: ${{ secrets.INTEGRATION_WORKSPACE_LOCATION }}
      I_UNDERSTAND_THIS_IS_PRODUCTION: ${{ inputs.i-know-this-hits-prod && 'yes' || '' }}
      # Device group the Defender shape probe puts on its disabled test
      # rule; without it the probe copies one from an existing scoped rule
      # or skips the scope questions. Never written to the report.
      DEFENDER_PROBE_DEVICE_GROUP: ${{ vars.DEFENDER_PROBE_DEVICE_GROUP }}
      # The kind kill switch applies to the live tests too: a test that
      # writes a switched-off kind skips unless this is set
      # (tests/integration/kill_switch.py). The label path never sets it.
      CONTENTOPS_LIVE_IGNORE_KILL_SWITCH: ${{ inputs.ignore-kill-switch && '1' || '' }}
    steps:
      - name: Checkout (loads the local composite action below)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Pipeline setup (checkout / python / deps / azure-login)
        # Composite action — see .github/actions/pipeline-setup/action.yml.
        # `extra-pip-packages: pytest` matches the pre-composite
        # behaviour of running pytest from a freshly-installed
        # environment that didn't already carry it.
        uses: ./.github/actions/pipeline-setup
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          disabled-kinds: ${{ vars.CONTENTOPS_DISABLED_KINDS }}
          tenant-config-yaml: ${{ secrets.TENANT_CONFIG_YAML }}
          extra-pip-packages: pytest

      - name: Run integration suite
        # sweep-only: select just the sweep test; its session fixtures
        # delete leftover test resources and nothing is created.
        # tests: one named live test file instead of the whole suite. The
        # value reaches the shell through env and must name a plain test
        # file under tests/integration; anything else stops here.
        # -rs prints why a test skipped (missing env, no confirmation).
        env:
          SWEEP_ONLY: ${{ inputs.sweep-only }}
          INPUT_TESTS: ${{ inputs.tests }}
        run: |
          set -euo pipefail
          if [ "$SWEEP_ONLY" = "true" ]; then
            pytest -q -rs tests/integration -k sweep_leftover
          elif [ -n "$INPUT_TESTS" ]; then
            if ! printf '%s' "$INPUT_TESTS" | grep -Eq '^tests/integration/test_[a-z0-9_]+\.py$' || [ ! -f "$INPUT_TESTS" ]; then
              echo "::error::The tests input must name one file tests/integration/test_<name>.py that exists. Nothing was run."
              exit 1
            fi
            pytest -q -rs "$INPUT_TESTS"
          else
            pytest -q -rs tests/integration
          fi

      - name: Upload the shape report
        # Written by the Defender shape probe: synthetic values and yes/no
        # answers only, never a value read from the tenant.
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: defender-shape-report-${{ github.run_id }}
          path: defender-shape-report.md
          if-no-files-found: ignore
          retention-days: 30
