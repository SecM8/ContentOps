name: Retry failed deployments

# Manual workflow_dispatch that runs `contentops retry-failed` against
# the configured tenant. Reads the latest audit/*.jsonl, derives the
# (asset, id) pairs whose status == failed, and re-applies only
# those. Useful after a transient ARM 5xx burst or a Defender Graph
# rate-limit.

on:
  workflow_dispatch:
    inputs:
      env:
        # type: choice locks operators to the three known tenant
        # environment slugs. `environment: ${{ inputs.env }}` below
        # dynamically references the GitHub Environment of the same
        # name; a free-text `type: string` here would let an operator
        # supply a non-existent env, which on some GitHub configs
        # silently bypasses the required-reviewer protection rule.
        description: "Tenant env slug (selects config/tenant.<env>.yml)."
        required: true
        default: "prod"
        type: choice
        options:
          - prod
          - integration
          - dev
      role:
        # Free-text string (not ``type: choice``) so the "no role"
        # case can be expressed as an empty default. actionlint's
        # syntax-check rule disallows empty entries in a choice
        # ``options:`` list, and a sentinel value ("none" / "skip")
        # would just push the empty-handling logic into the run:
        # block. Single-workspace tenants pass an empty string and
        # the CLI invocation skips the ``--role`` flag entirely.
        description: "Sentinel workspace role to retry against (prod/integration/dev). Leave blank for single-workspace tenants."
        required: false
        default: ""
        type: string
      dry_run:
        # Default true, like prune and rollback: a retry writes to the
        # tenant, so a real run is a deliberate choice (with confirm).
        description: "Dry-run (default true): list the retry set without re-applying. Uncheck plus type CONFIRM to re-apply."
        required: true
        default: true
        type: boolean
      confirm:
        description: "Type CONFIRM to allow a real (non-dry-run) retry. Anything else aborts."
        required: false
        default: ""
        type: string
      deploy_run_id:
        description: "Deploy run id whose audit trail to retry from. Empty = the newest completed deploy run on this ref."
        required: false
        default: ""
        type: string

permissions:
  id-token: write
  # state sync pushes refs/heads/state/<env> after a non-dry-run retry
  # so subsequent workflows see the freshly-applied entries.
  contents: write
  # The audit-trail fetch step lists deploy runs and downloads their
  # audit artefact.
  actions: read

# One queue for every workflow that pushes the tenant state (deploy, retry-failed,
# rollback, prune, state-adopt), whatever the env input: the state branch is
# named after tenant.yml's name, so with a single tenant.yml an env=integration
# run pushes the same branch as a prod deploy. Behind the queue, state sync push
# refuses a stale push. GitHub keeps one pending run per group: dispatch one at a time.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  retry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The GitHub Environment name has to match the federated-credential
    # subject the App Registration was issued, NOT the `--role` tenant.yml
    # slug. Convention in this repo (matching deploy.yml + integration-
    # deploy.yml + prune.yml after PR #251): the prod role binds to the
    # `production` Environment. Without this mapping the OIDC step fails
    # with AADSTS700213 "No matching federated identity record found for
    # presented assertion subject 'repo:.../:environment:prod'". The
    # `integration` and `dev` slugs already match their Environment names
    # so they pass through.
    environment: ${{ fromJSON('{"prod":"production","integration":"integration","dev":"dev"}')[inputs.env] }}
    env:
      PIPELINE_ENV: ${{ inputs.env }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
    steps:
      - name: Refuse a real run without CONFIRM
        # Before anything logs in: a real retry re-applies to the tenant.
        if: ${{ inputs.dry_run == false && inputs.confirm != 'CONFIRM' }}
        run: |
          echo "::error::Refusing a real retry: dry_run is off but confirm is not CONFIRM. Nothing was applied."
          echo "Run the workflow again with confirm=CONFIRM to re-apply, or leave dry_run on to list the retry set."
          exit 1

      - name: Checkout (loads the local composite action below)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Refuse a re-run of an older commit
        # A re-run re-applies its own run's files over everything merged
        # since.
        uses: ./.github/actions/refuse-stale-rerun
        with:
          run-kind: retry

      - name: Pipeline setup (checkout / python / deps / azure-login)
        # Composite action — see .github/actions/pipeline-setup/action.yml.
        # PIPELINE_ENV is exported on the job env above; the
        # composite's env-aware tenant-config path activates
        # automatically.
        uses: ./.github/actions/pipeline-setup
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          disabled-kinds: ${{ vars.CONTENTOPS_DISABLED_KINDS }}
          tenant-config-yaml: ${{ secrets.TENANT_CONFIG_YAML }}
          tenant-config-env-yaml: ${{ secrets.TENANT_CONFIG_ENV_YAML }}
          role: ${{ inputs.env }}

      - name: Pull state before retry
        # retry-failed reads the (asset, id) pairs to re-apply from the
        # audit trail, then records its results in this state file, which
        # the push below lands on the state branch. No state branch yet is
        # fine; any other pull failure stops the run before it writes.
        run: |
          contentops state sync pull

      - name: Fetch the deploy audit trail
        # The audit trail is not committed; deploy.yml uploads it as the
        # `audit-<run id>` artefact. Without this step retry-failed sees
        # no audit/ directory in a fresh checkout and always reports
        # "nothing to retry" (found 2026-10-18). Download the audit of
        # the requested deploy run, or of the newest completed deploy
        # run on this ref. A checkout that already carries audit/ wins.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_DEPLOY_RUN_ID: ${{ inputs.deploy_run_id }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if compgen -G "audit/*.jsonl" > /dev/null; then
            echo "audit/ already present in the checkout; using it."
            exit 0
          fi
          RUN_ID="$INPUT_DEPLOY_RUN_ID"
          if [ -z "$RUN_ID" ]; then
            # Newest completed deploy run that actually uploaded an audit
            # artefact. A push whose deploy job was skipped (no detection
            # changed) completes without one and must not shadow the last
            # real deploy.
            for id in $(gh run list --workflow deploy.yml --branch "$REF_NAME" --status completed --limit 10 --json databaseId --jq '.[].databaseId'); do
              if gh api "repos/{owner}/{repo}/actions/runs/$id/artifacts" --jq '.artifacts[].name' | grep -qx "audit-$id"; then
                RUN_ID="$id"
                break
              fi
            done
          fi
          if [ -z "$RUN_ID" ]; then
            echo "::notice::No completed deploy run with an audit artefact found on $REF_NAME; nothing to retry."
            exit 0
          fi
          if gh run download "$RUN_ID" -n "audit-$RUN_ID" -D audit; then
            echo "Fetched audit trail of deploy run $RUN_ID: $(ls audit)"
          else
            echo "::warning::Deploy run $RUN_ID has no audit-$RUN_ID artefact (expired, or it pre-dates the audit upload); nothing to retry."
          fi

      - name: Run contentops retry-failed
        # Route workflow_dispatch inputs through env vars before
        # using them in the shell. Direct ``${{ inputs.role }}``
        # interpolation would substitute the operator-supplied
        # text BEFORE the shell parses the line -- a classic
        # GitHub Actions expression-injection vector. With
        # ``role`` switched to ``type: string`` (see role input
        # above) the value is now free text; piping through env
        # vars closes the injection surface. ``inputs.dry_run``
        # is already safe (boolean type, schema-constrained) but
        # routed for consistency.
        env:
          INPUT_ROLE: ${{ inputs.role }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=( "--path" "detections" )
          if [ -n "$INPUT_ROLE" ]; then
            ARGS+=("--role" "$INPUT_ROLE")
          fi
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            ARGS+=("--dry-run")
          fi
          contentops retry-failed "${ARGS[@]}"

      - name: Push state after retry
        # Only push when we actually re-applied. Dry-run doesn't
        # mutate state.json.
        if: ${{ inputs.dry_run == false }}
        run: |
          set -euo pipefail
          # `state sync push` reads state/<env>/state.json (<env> =
          # tenant.yml's name), never the env-less state/state.json the
          # old gate tested -- so the push was always skipped.
          if compgen -G "state/*/state.json" > /dev/null; then
            contentops state sync push
          else
            echo "::notice::No state/<env>/state.json written; skipping state sync push."
          fi

      - name: Upload audit JSONL
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: retry-audit-${{ github.run_id }}
          path: audit/
          if-no-files-found: ignore
          retention-days: 90

      - name: Step summary
        if: always()
        # Same expression-injection consideration as the run step
        # above: route inputs through env vars so the operator-
        # supplied text isn't substituted into the shell at
        # template-expansion time. The values are bash-quoted
        # inside backticks for markdown rendering.
        env:
          INPUT_ENV: ${{ inputs.env }}
          INPUT_ROLE: ${{ inputs.role }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            echo "## retry-failed"
            echo "- env: \`$INPUT_ENV\`"
            echo "- role: \`$INPUT_ROLE\`"
            echo "- dry-run: \`$INPUT_DRY_RUN\`"
          } >> "$GITHUB_STEP_SUMMARY"
